  - id: AHF-DAG-MAINT-002
    title: Establish Remote Publication as part of Task completion
    purpose: >-
      Make verified remote publication a deterministic prerequisite of final
      Task completion while preserving pre-rule successful history and
      avoiding a self-referential commit-SHA bootstrap.
    priority: 1000
    requires:
      - type: DECISION
        id: TASK_DAG_CONTRACT@v0
      - type: ARTIFACT
        id: TASK_DAG_CONTRACT_DOC@v0
      - type: ARTIFACT
