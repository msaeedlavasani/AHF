  - id: AHF-DAG-MAINT-004
    title: Correct Foundation seed-state test semantics
    purpose: >-
      Make the active test verify the published MAINT-003 seed commit instead
      of prohibiting legitimate later Task attempts. MAINT-003's exact evidence
      remains preserved by its commit-addressed evidence validation. This
      maintenance Task does not execute future Foundation work, resolve Owner
      decisions, adopt audit findings, or change the seeded Task ordering and
      acceptance contracts.
    priority: 1000
    requires:
      - type: DECISION
        id: TASK_DAG_CONTRACT@v0
      - type: DECISION
        id: CLEAN_START_FOUNDATION_COMPLETENESS@v0
      - type: ARTIFACT
        id: TASK_DAG_CONTRACT_DOC@v0
      - type: ARTIFACT
