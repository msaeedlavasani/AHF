  - id: FOUNDATION-003-LEGACY-KNOWLEDGE-INDEX
    title: Create the Legacy Knowledge Index
    purpose: >-
      Create a structured, repository-native index of useful knowledge in
      the legacy Apex-Home-Fitness repository so future AHF work can locate
      relevant historical evidence without repeatedly rediscovering the old
      repository. Indexing does not imply adoption, and nothing transfers
      automatically. Historical material may later be independently
      reviewed for revalidation, adoption, modification, supersession,
      rejection, or retention as historical evidence only. Locate and index
      the historical Task Passport / task-contract approach without
      redesigning it so later Clean Foundation work can decide whether to
      ADOPT, MODIFY, or REJECT it before ahf-dag gains any Task Passport
      capability.
    priority: 100
    requires:
      - type: DECISION
        id: PRODUCT_CONSTITUTION@v0
      - type: DECISION
        id: DOMAIN_GLOSSARY@v0
      - type: DECISION
        id: DOMAIN_MODEL@v0
      - type: DECISION
        id: TASK_DAG_CONTRACT@v0
      - type: ARTIFACT
        id: TASK_DAG_CONTRACT_DOC@v0
    depends_on:
      - AHF-CLEAN-FOUNDATION-002
    produces:
      - type: ARTIFACT
        id: LEGACY_KNOWLEDGE_INDEX@v0
    acceptance_criteria:
      - id: knowledge_index_exists
        check:
          type: file_exists
          path: .dag/outputs/legacy-knowledge-index.yaml
      - id: product_domain_decisions_category_present
        check:
          type: file_contains
