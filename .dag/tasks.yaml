        id: FOUNDATION_COMPLETENESS_DAG_TESTS@v0
    acceptance_criteria:
      - id: active_test_uses_seed_commit
        check:
          type: file_contains
          path: test/foundation_completeness_dag_test.rb
          text: "SEED_COMMIT = \"fa2ef8449fd458e418622e9c16c8a52363a3723d\""
      - id: active_test_asserts_historical_seed_state
        check:
          type: file_contains
          path: test/foundation_completeness_dag_test.rb
          text: test_new_foundation_work_was_unexecuted_when_seeded
      - id: audit_review_remains_unexecuted
        check:
          type: command_succeeds
          argv:
            - ruby
            - -e
            - "require 'open3'; require 'yaml'; content, error, status = Open3.capture3('git', 'show', 'ba346e38e32701d72a001dd4daf1e1ef83e2f012:.dag/tasks.yaml'); abort error unless status.success?; tasks = YAML.safe_load(content, permitted_classes: [], permitted_symbols: [], aliases: false).fetch('tasks'); audit = tasks.find { |task| task.fetch('id') == 'FOUNDATION-AUDIT-REVIEW' }; abort 'audit task had attempts at MAINT-004 completion' unless audit.fetch('attempts').empty?"
    required_evidence:
