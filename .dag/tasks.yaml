  - id: FOUNDATION-003-LEGACY-DECISION-HARVEST
    title: Harvest and classify legacy AHF decisions
    purpose: >-
      Use the old Apex-Home-Fitness repository strictly as an evidence,
      knowledge, and migration source. Extract explicit historical
      product, domain, and execution decisions and classify them for the
      Clean Foundation. Nothing transfers automatically. Candidates must
      be classified as REVALIDATE, REVIEW, or REJECT / SUPERSEDE where
      appropriate, and remain candidates until reviewed under the Clean
      Foundation.
    priority: 100
    requires:
      - type: DECISION
        id: PRODUCT_CONSTITUTION@v0
      - type: DECISION
        id: DOMAIN_GLOSSARY@v0
      - type: DECISION
        id: DOMAIN_MODEL@v0
      - type: DECISION
        id: TASK_DAG_CONTRACT@v0
      - type: ARTIFACT
        id: TASK_DAG_CONTRACT_DOC@v0
    depends_on:
      - AHF-CLEAN-FOUNDATION-002
    produces:
      - type: ARTIFACT
        id: LEGACY_DECISION_CANDIDATES@v0
    acceptance_criteria:
      - id: candidate_artifact_exists
        check:
          type: file_exists
          path: .dag/outputs/legacy-decision-candidates.yaml
      - id: revalidate_classification_present
        check:
          type: file_contains
          path: .dag/outputs/legacy-decision-candidates.yaml
          text: REVALIDATE
      - id: review_classification_present
        check:
          type: file_contains
          path: .dag/outputs/legacy-decision-candidates.yaml
          text: REVIEW
      - id: rejection_classification_present
        check:
          type: file_contains
          path: .dag/outputs/legacy-decision-candidates.yaml
          text: REJECT
      - id: supersede_classification_present
        check:
          type: file_contains
          path: .dag/outputs/legacy-decision-candidates.yaml
          text: SUPERSEDE
    required_evidence:
      - id: classified_candidates
        path: .dag/outputs/legacy-decision-candidates.yaml
    validations:
      - id: candidate_yaml_parses
        check:
          type: command_succeeds
          argv:
            - ruby
            - -e
            - "require 'yaml'; YAML.safe_load(File.read('.dag/outputs/legacy-decision-candidates.yaml'), permitted_classes: [], permitted_symbols: [], aliases: false)"
    attempts: []

  - id: FOUNDATION-004-IDENTITY-MODEL
    title: Define the AHF Identity Model
    purpose: >-
      Prepare an Identity Model candidate for Foundation review only after
      the legacy decision harvest is complete. This Task entry does not
      design or resolve the Identity Model.
    priority: 90
    requires:
      - type: DECISION
        id: PRODUCT_CONSTITUTION@v0
      - type: DECISION
        id: DOMAIN_GLOSSARY@v0
      - type: DECISION
        id: DOMAIN_MODEL@v0
      - type: DECISION
        id: TASK_DAG_CONTRACT@v0
      - type: ARTIFACT
        id: LEGACY_DECISION_CANDIDATES@v0
    depends_on:
      - FOUNDATION-003-LEGACY-DECISION-HARVEST
    produces:
      - type: ARTIFACT
        id: IDENTITY_MODEL_CANDIDATE@v0
    acceptance_criteria:
      - id: identity_candidate_exists
        check:
          type: file_exists
          path: docs/foundation/decisions/identity-model-candidate-v0.md
    required_evidence:
      - id: identity_candidate
        path: docs/foundation/decisions/identity-model-candidate-v0.md
    validations:
      - id: candidate_remains_unresolved
        check:
          type: file_contains
          path: docs/foundation/decisions/identity-model-candidate-v0.md
          text: "Status: DRAFT"
    attempts: []
