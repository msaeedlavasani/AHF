comparison_rules:
  - Resolved Clean Foundation decisions control current product/domain meaning.
  - Historical consistency can support revalidation but cannot create adoption.
  - Historical implementation proves only what existed at the pinned revision.
  - Any detail beyond the resolved v0 concepts remains unresolved unless a later Owner decision resolves it.
  - Past prescriptions and executions retain their historical meaning; future adaptation cannot rewrite them.

foundation_alignment:
  product_definition:
    resolved_meaning: personalized home-training coach that prescribes and accompanies real execution
    supporting_legacy_records:
      - LKI-PRODUCT-001
      - LKI-WORKOUT-001
    finding: >-
      Legacy personalization and guided-workout evidence is consistent with the
      resolved definition. Legacy platform, channel, localization, offline,
      generator, and safety implementation choices are not part of that resolved
      definition and are not adopted.
  product_loop:
    resolved_meaning:
      - Assess
      - Prescribe
      - Perform
      - Observe
      - Adapt
    supporting_legacy_records:
      - LKI-PRODUCT-001
      - LKI-DOMAIN-003
    finding: >-
      The legacy Plan/Execute/Progress framing is historical evidence only. The
      five-stage Clean Foundation loop is canonical; no legacy stage name or
      implementation silently replaces it.
  prescription_and_execution:
    resolved_meaning: prescription, execution, observation, and adaptation are distinct responsibilities
    supporting_legacy_records:
      - LKI-WORKOUT-001
      - LKI-WORKOUT-002
      - LKI-DOMAIN-003
    finding: >-
      The legacy separation of Program/prescription, session orchestration,
      outcomes, and later adaptation is useful evidence. Its state machine,
      orchestration design, completion vocabulary, and persistence remain
      unselected.
  exercise_and_entry_identity:
    resolved_meaning: Exercise and Exercise Entry have independent identity; repeated entries may reference one Exercise
    supporting_legacy_records:
      - LKI-DOMAIN-002
      - LKI-IDENTITY-001
    finding: >-
      Durable Exercise identity and repeated prescribed-entry corrections are
      consistent historical evidence. Movement Graph, database identifiers,
      migration strategy, and exact persistence shape are not Foundation v0
      decisions.
  set_result_and_workout_outcome:
    resolved_meaning: observed Set Result and Workout Outcome are distinct from prescriptions and terminal state
    supporting_legacy_records:
      - LKI-DOMAIN-003
      - LKI-WORKOUT-002
    finding: >-
      The legacy outcome contract and terminal/completion distinction support
      later review. Exact Set Result fields, Workout Outcome schema, completion
      classifications, adherence rules, and credit semantics remain unresolved.
  intelligent_capabilities:
    resolved_meaning: camera, sensing, pose, and AI may enhance execution but cannot be prerequisites for an executable workout
    supporting_legacy_records:
      - LKI-CAMERA-001
      - LKI-CAMERA-002
      - LKI-MENTOR-001
    finding: >-
      Legacy sensing, Mentor, asset, and fallback records are evidence for later
      review. No camera, pose, model, asset, or fallback implementation is
      adopted, and physical-device acceptance remains an evidence gap.
  adaptation:
    resolved_meaning: previous prescriptions, session outcomes, and user state may inform future prescriptions without rewriting history
    supporting_legacy_records:
      - LKI-DOMAIN-003
    finding: >-
      Legacy outcome, profile, input-pipeline, and adaptive-decision records are
      candidates for revalidation. No Adaptation entity, algorithm, policy,
      persistence, or model architecture is created.

reviewed_capabilities:
  - stable_id: CAP-PRODUCT-DOMAIN
