      High-level personalization, guided execution, durable Exercise identity,
      separate outcomes, and future adaptation inputs overlap the resolved Clean
      Foundation. Legacy terminology and all additional product behavior require
      independent review.
    confidence_and_gaps: >-
      Provenance is exact at the pinned revision; product segments, safety
      promises, localization commitments, and adaptation behavior extend beyond
      the resolved v0 product/domain scope.
  - stable_id: CAP-WORKOUT-EXECUTION
    source_records:
      - LKI-WORKOUT-001
      - LKI-WORKOUT-002
    review_finding: >-
      The evidence demonstrates historical guided execution and a distinction
      between terminality and outcome credit. Exact execution lifecycle,
      completion, deferral, skip, exit, and orchestration semantics remain open.
    confidence_and_gaps: >-
      Historical contracts and implementation paths are indexed; Clean AHF has
      not selected a workout state machine or completion semantics.
  - stable_id: CAP-IDENTITY-PERSISTENCE
    source_records:
