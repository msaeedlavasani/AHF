      the resolved glossary. The legacy schema and migrations are evidence only.
    confidence_and_gaps: >-
      Identity boundaries, database technology, exact schema, migration policy,
      user identity, and account lifecycle require later resolution.
  - stable_id: CAP-RECOVERY-CHECKPOINT
    source_records:
