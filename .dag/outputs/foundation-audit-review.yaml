  - Record exact repository, revision, branch, worktree state, tracked-path count, accessible refs, and exclusions.
  - Enumerate every tracked path and relevant history rather than relying on category labels.
  - Give every capability stable identity, exact provenance, evidence class, relationships, confidence and gaps, review state, and disposition state.
  - Account for all LKI records, split overloaded records, and record omissions and obsolete claims.
  - Sequence unresolved Owner decisions before dependent contracts.
  - Require explicit Task inputs, outputs, evidence, validation, dependencies, and publication proof.

