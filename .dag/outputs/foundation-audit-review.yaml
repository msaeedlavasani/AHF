executive_findings:
  - id: AUDIT-FINDING-001
    finding: The audit environment could not freshly query GitHub, so remote refs and publication were not independently verified there.
    treatment: Preserve the limitation; do not infer publication failure or remote currency.
  - id: AUDIT-FINDING-002
    finding: The 18-entry Legacy Knowledge Index is seed discovery, not exhaustive; the pinned legacy tree contained 723 tracked paths.
    treatment: Mechanically account for every tracked path and reconcile every seed record.
  - id: AUDIT-FINDING-003
    finding: Material evidence exists beyond the index across product, governance, execution, identity, privacy, localization, AI, observability, recovery, devices, accessibility, persistence, CI, deployment, and correction history.
    treatment: Treat each area as a discovery lead, never automatic authority or adoption.
  - id: AUDIT-FINDING-004
    finding: FOUNDATION-004 is sound DRAFT identity evidence, not a resolved decision.
    treatment: Require it only as input to later Owner-gated resolution.
  - id: AUDIT-FINDING-005
    finding: Completeness, review branches, Owner gates, boundary resolution, and baseline review must precede implementation architecture.
    treatment: Follow the Owner-corrected repository DAG.

